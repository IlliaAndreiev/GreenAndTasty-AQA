name: Green and Tasty AQA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  aqa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__DefaultConnection: "Data Source=aqa_ci.db"
      AQA_BASE_URL: http://127.0.0.1:5065

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 and 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build Backend
        run: dotnet build backend/GroupPreOrder.Api/GroupPreOrder.Api.csproj

      - name: Build AQA tests
        run: dotnet build RestaurantAqa.Tests/RestaurantAqa.Tests.csproj

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          ./RestaurantAqa.Tests/bin/Debug/net9.0/playwright.ps1 install --with-deps chromium

      - name: Start Backend
        shell: bash
        run: |
          dotnet run \
            --project backend/GroupPreOrder.Api/GroupPreOrder.Api.csproj \
            --no-build \
            --no-launch-profile \
            --urls http://127.0.0.1:5065 \
            > backend.log 2>&1 &

      - name: Wait for Backend health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5065/api/health; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done

          cat backend.log
          exit 1

      - name: Run all AQA tests
        run: |
          dotnet test RestaurantAqa.Tests/RestaurantAqa.Tests.csproj \
            --no-build \
            --logger "trx;LogFileName=aqa-results.trx"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqa-test-results
          path: |
            RestaurantAqa.Tests/TestResults/
            RestaurantAqa.Tests/**/aqa-results.trx
            RestaurantAqa.Tests/**/screenshots/
            RestaurantAqa.Tests/**/traces/
            backend.log
          if-no-files-found: ignore